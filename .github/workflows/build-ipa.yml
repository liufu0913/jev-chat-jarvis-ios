name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (no code signing)
        run: |
          xcodebuild -project JevJarvis.xcodeproj \
            -target JevJarvis \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build
          BUILT_PRODUCTS_DIR=$(xcodebuild -project JevJarvis.xcodeproj -target JevJarvis -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO -showBuildSettings 2>/dev/null | awk -F' = ' '/BUILT_PRODUCTS_DIR/{print $2; exit}')
          echo "BUILT_PRODUCTS_DIR=$BUILT_PRODUCTS_DIR" >> $GITHUB_ENV

      - name: Verify keyboard extension is embedded
        run: |
          echo "Products at: $BUILT_PRODUCTS_DIR"
          ls -la "$BUILT_PRODUCTS_DIR/JevJarvis.app/PlugIns/"

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "$BUILT_PRODUCTS_DIR/JevJarvis.app" Payload/
          zip -qr jev-jarvis-unsigned.ipa Payload
          ls -la jev-jarvis-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jev-jarvis-ipa
          path: jev-jarvis-unsigned.ipa
