name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (no code signing)
        run: |
          xcodebuild -project JevJarvis.xcodeproj \
            -target JevJarvis \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify keyboard extension is embedded
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path '*JevJarvis*/Build/Products/Release-iphoneos/JevJarvis.app' | head -1)
          echo "App at: $APP_PATH"
          ls -la "$APP_PATH/PlugIns/"

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path '*JevJarvis*/Build/Products/Release-iphoneos/JevJarvis.app' | head -1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr jev-jarvis-unsigned.ipa Payload
          ls -la jev-jarvis-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jev-jarvis-ipa
          path: jev-jarvis-unsigned.ipa
